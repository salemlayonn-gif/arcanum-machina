<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ARCANUM MACHINA</title>

  <meta name="description" content="A lone archivist rebuilds a ruined archive in a broken land, and finds the ruins are a message.">
  <meta name="theme-color" content="#07070f">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Arcanum Machina">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
  <div id="intro-screen"></div>
  <div id="game-container" class="hidden">
    <div id="header"></div>
    <div id="nav"></div>
    <div id="content"></div>
    <div id="log-panel"></div>
  </div>
  <div id="notification-area"></div>

  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/combat.js"></script>
  <script src="js/exploration.js"></script>
  <script src="js/prestige.js"></script>
  <script src="js/render.js"></script>
  <script src="js/music.js"></script>
  <script src="js/sounds.js"></script>
  <script src="js/saves.js"></script>
  <script src="js/main.js"></script>

  <script>
    /* The Archive keeps running without a network once it has been visited once. */
    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('sw.js').catch(function() {});
      });
    }
  </script>
</body>
</html>
